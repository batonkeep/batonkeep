[project]
name = "batonkeep-backend"
version = "0.1.0"
description = "Cross-provider plan orchestrator backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.140.0",
    "starlette==1.3.1",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "aiosqlite==0.22.1",
    "alembic==1.18.5",
    "apscheduler==3.11.3",
    "openai==2.48.0",
    "anthropic==0.120.0",
    "google-genai==2.14.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "cryptography==49.0.0",
    "python-multipart==0.0.32",
    "websockets==16.1.1",
    "aiofiles==24.1.0",
    "greenlet==3.5.4",
    "pyte>=0.8.2",
    # D-0073 D1a — headless browsing. The python package is small; the browser binary
    # is installed separately in the Dockerfile (`playwright install chromium`) so the
    # ~170 MB download is one image layer rather than a runtime surprise on first use.
    "playwright==1.57.0",
    # S0 substrate: the project context manifest (batonkeep.yaml) parser.
    # Previously only a transitive dep; pinned now that app code imports it.
    "pyyaml==6.0.3",
    # P-0046 slice 4 — SDK-backed MCP tool seam (curated Tier A `fetch` server).
    # mcp 1.27 needs pydantic>=2.11 (hence the 2.10.3→2.13.4 bump). fastapi 0.137.1
    # drops starlette's upper cap (>=0.46), so we pin starlette==1.3.1 directly to
    # clear the Dependabot starlette CVE cluster; mcp needs only starlette>=0.27.
    # 1.28.1 clears GHSA WebSocket-transport Host/Origin validation advisory.
    "mcp==2.0.0",
    # 2026.6.4 relaxes the old httpx<0.28 pin (modelcontextprotocol/servers#3287);
    # resolves with starlette 1.3.1 / uvicorn 0.32.1.
    # Runs SSRF-fenced behind sandbox.wrap() (see mcp_provider.py).
    "mcp-server-fetch==2026.7.10",
    # Transitive only (google-genai → google-auth → pyasn1-modules → pyasn1), pinned
    # to clear three PYSEC advisories against 0.6.3 that are all availability-only
    # (CVSS C:N/I:N/A:H — a malformed ASN.1 input hangs or crashes the parser).
    # Low exposure here: the ASN.1 it decodes is OAuth/JWT/certificate material from
    # Google's endpoints, not anything a user or agent supplies. Pinned rather than
    # left to resolution for the same reason as starlette/mcp above — a floor we can
    # point an advisory at.
    "pyasn1>=0.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "anyio==4.14.2",
    "ruff==0.16.0",
    "mypy==1.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "anyio==4.14.2",
    "ruff==0.16.0",
    "mypy==1.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
